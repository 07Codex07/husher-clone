# Local Redis for the BullMQ worker and cross-instance order events.
#   docker compose up -d redis     then set REDIS_URL=redis://localhost:6379
services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 5
